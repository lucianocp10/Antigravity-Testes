<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081c30">
  <meta name="description" content="Apresentação interativa de Ciências para o 8º ano sobre coração, vasos sanguíneos, circulação pulmonar e sistêmica.">
  <title>Sistema circulatório — Ciências, 8º ano</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#081c30;color:#f3f8ff;--navy:#081c30;--deep:#0b2236;--panel:#102f43;--teal:#71e3cf;--teal-strong:#32deb0;--gold:#ffcf70;--blue:#4ca8ff;--red:#ff727d;--muted:#bad3e1;--line:#ffffff28}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 12%,#144b58 0,transparent 42%),radial-gradient(ellipse at 8% 90%,#112d4a 0,transparent 36%),var(--navy);color:#f3f8ff}
    button,select{font:inherit;color:inherit;background:#173b50;border:1px solid #7699aa;border-radius:12px;padding:10px 14px;cursor:pointer}
    button:hover,select:hover{background:#25657b}
    button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    button:disabled{opacity:.45;cursor:not-allowed}
    a{color:#80dfed}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4vw;background:#081c30ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
    .brand{font-weight:800;letter-spacing:.04em;white-space:nowrap}.brand span{color:var(--teal)}
    header nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    header select{max-width:min(32vw,420px);min-width:170px}
    .utility{display:flex;gap:7px;flex-wrap:wrap}
    progress{width:100%;height:5px;display:block;accent-color:#66e3cb;border:0}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    main{max-width:1400px;margin:0 auto;padding:clamp(22px,4vh,44px) clamp(18px,5vw,72px) 54px;min-height:78vh}
    .slide{animation:arrive .38s ease both}
    @keyframes arrive{from{opacity:.35;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    .eyebrow{color:var(--teal);letter-spacing:2.6px;text-transform:uppercase;font-size:13px;font-weight:800}
    h1{font-size:clamp(34px,5vw,68px);line-height:1.05;letter-spacing:-.035em;margin:14px 0 24px;max-width:1040px}
    h1 .accent{color:var(--teal-strong)}
    h2{font-size:clamp(23px,3vw,39px);line-height:1.15;margin:0 0 18px}
    h3{font-size:clamp(20px,2.1vw,28px);margin:0 0 10px}
    p{line-height:1.55}
    .lead{font-size:clamp(20px,2vw,29px);line-height:1.5;border-left:3px solid #51cdb7;padding-left:18px;margin:14px 0 22px}
    .layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,1fr);gap:clamp(22px,4vw,58px);align-items:center}
    .art{background:#ffffff08;border:1px solid var(--line);border-radius:28px;min-height:320px;padding:22px;display:grid;place-items:center;position:relative;overflow:hidden}
    figure{margin:0;width:100%}.photo{display:block;width:100%;max-height:460px;object-fit:contain;border-radius:18px;background:#091a29}.caption{font-size:13px;color:var(--muted);line-height:1.4;margin:10px 2px 0}
    .cover{min-height:65vh;display:grid;grid-template-columns:1fr .95fr;gap:4vw;align-items:center}.cover-copy h1{font-size:clamp(42px,6.5vw,82px);margin:15px 0 18px}.cover-copy p{font-size:clamp(21px,2.4vw,32px);color:#dbe9f1;line-height:1.45}.cover-visual{position:relative}.cover-visual .art{min-height:400px}.cover-visual img{width:min(100%,540px);max-height:390px;object-fit:contain;filter:drop-shadow(0 24px 32px #0008)}.cover-stamp{display:inline-block;border:1px solid #6edcc65e;border-radius:99px;padding:8px 13px;color:#b5f3e6;font-size:14px;margin-top:10px}
    .three-parts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}.part{min-height:175px;border:1px solid var(--line);border-radius:22px;background:#0c2335;padding:20px}.part .symbol{font-size:34px}.part p{font-size:18px;color:#d9e8ef;margin:8px 0 0}.part strong{color:var(--teal)}
    .heart-layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr);gap:24px;align-items:stretch}.heart-photo{padding:15px}.heart-photo img{width:100%;height:100%;max-height:430px;object-fit:contain;border-radius:16px}.chamber-graphic{width:min(100%,500px);padding:18px;border-radius:22px;background:#0b2236;border:1px solid #ffffff22}.side-labels{display:grid;grid-template-columns:1fr 1fr;gap:14px}.side-label{font-size:14px;text-transform:uppercase;letter-spacing:1px;text-align:center;color:#b9d3df;padding-bottom:7px}.side{display:grid;gap:10px}.chamber{min-height:88px;border:1px solid #ffffff36;border-radius:18px;display:grid;place-items:center;text-align:center;padding:12px 8px;font-size:clamp(15px,1.5vw,19px);font-weight:750;box-shadow:inset 0 1px 0 #ffffff22,0 10px 22px #0003}.chamber small{display:block;font-size:12px;font-weight:500;opacity:.9;margin-top:3px}.chamber.blue{background:linear-gradient(140deg,#2879bd,#154c80)}.chamber.red{background:linear-gradient(140deg,#d85a64,#7c2839)}.chamber-arrow{text-align:center;color:var(--gold);font-size:23px;line-height:.7}
    .flow-rule{display:grid;grid-template-columns:repeat(5,auto);align-items:center;justify-content:center;gap:10px;margin:25px 0 5px}.flow-step{background:#12354a;border:1px solid #55778a;border-radius:16px;padding:12px 16px;text-align:center;font-weight:750}.flow-arrow{color:var(--gold);font-size:25px}.note{color:#c2d5e1;font-size:16px;line-height:1.45}.pill{display:inline-flex;padding:6px 11px;border-radius:99px;background:#153c50;color:#dbf6ee;font-size:14px;margin:4px}.gold{color:#ffdb91}.blue-text{color:#82c5ff}.red-text{color:#ff929a}
    .circuit-layout{display:grid;grid-template-columns:minmax(340px,1fr) minmax(300px,.95fr);gap:30px;align-items:center}.circuit-stage{position:relative;min-height:390px;border:1px solid #ffffff2c;border-radius:30px;background:radial-gradient(ellipse at center,#123c50 0,#0b2236 60%);overflow:hidden;perspective:1000px;isolation:isolate}.circuit-stage:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff15 1px,transparent 1px);background-size:22px 22px;opacity:.55;mask-image:radial-gradient(ellipse at center,#000,transparent 78%)}
    .orbit-ring{position:absolute;left:50%;top:50%;width:min(68%,390px);height:52%;border-radius:50%;transform:translate(-50%,-50%) rotateX(57deg) rotateZ(-9deg);transform-style:preserve-3d;background:conic-gradient(from 210deg,var(--blue) 0 47%,var(--red) 50% 97%,var(--blue) 100%);-webkit-mask:radial-gradient(ellipse,transparent 56%,#000 58%);mask:radial-gradient(ellipse,transparent 56%,#000 58%);filter:drop-shadow(0 0 12px #5db3ff77);opacity:.9}
    .orbit-core{position:absolute;left:50%;top:50%;width:92px;height:92px;display:grid;place-items:center;transform:translate(-50%,-50%) translateZ(18px);border-radius:50%;background:radial-gradient(circle at 32% 25%,#ffb4bd,#e04a5b 40%,#742238 78%);box-shadow:inset -9px -11px 18px #250b20aa,inset 5px 5px 12px #fff6,0 20px 35px #0006;font-size:30px;z-index:3;animation:heartBeat 1.25s ease-in-out infinite}
    @keyframes heartBeat{0%,100%{transform:translate(-50%,-50%) translateZ(18px) scale(1)}35%{transform:translate(-50%,-50%) translateZ(18px) scale(1.08)}48%{transform:translate(-50%,-50%) translateZ(18px) scale(1)}}
    .route-node{position:absolute;z-index:4;min-width:126px;max-width:150px;text-align:center;padding:10px 12px;border:1px solid #ffffff40;border-radius:18px;background:linear-gradient(150deg,#1c4357,#0b2538);box-shadow:0 14px 26px #0005,inset 0 1px 0 #ffffff20;transform:translateZ(25px);font-size:14px;font-weight:750}.route-node small{display:block;color:#d0e0e9;font-size:12px;font-weight:500;margin-top:3px}.node-top{top:7%;left:50%;transform:translateX(-50%) translateZ(25px)}.node-left{left:4%;top:63%}.node-right{right:4%;top:63%}.node-bottom{left:50%;bottom:5%;transform:translateX(-50%) translateZ(30px)}
    .blood-cell{position:absolute;left:50%;top:50%;z-index:5;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#8bdbff 22%,#1675bd 75%);box-shadow:0 0 16px #56b6ff;animation:flow3d 8s linear infinite;transform-style:preserve-3d}
    .blood-cell:nth-of-type(2){animation-delay:-2.7s}.blood-cell:nth-of-type(3){animation-delay:-5.4s}
    @keyframes flow3d{0%{transform:translate3d(-145px,-7px,38px)}25%{transform:translate3d(-24px,-80px,16px)}50%{transform:translate3d(145px,2px,-17px);background:radial-gradient(circle at 30% 25%,#fff,#ffb8a3 22%,#d63e51 75%);box-shadow:0 0 16px #ff6275}75%{transform:translate3d(15px,80px,-8px);background:radial-gradient(circle at 30% 25%,#fff,#ffb8a3 22%,#d63e51 75%);box-shadow:0 0 16px #ff6275}100%{transform:translate3d(-145px,-7px,38px)}}
    .circuit-stage.systemic .blood-cell{animation-name:flow3dSystemic}
    @keyframes flow3dSystemic{0%{transform:translate3d(-145px,-7px,38px);background:radial-gradient(circle at 30% 25%,#fff,#ffb8a3 22%,#d63e51 75%);box-shadow:0 0 16px #ff6275}25%{transform:translate3d(-24px,-80px,16px);background:radial-gradient(circle at 30% 25%,#fff,#ffb8a3 22%,#d63e51 75%);box-shadow:0 0 16px #ff6275}50%{transform:translate3d(145px,2px,-17px);background:radial-gradient(circle at 30% 25%,#fff,#8bdbff 22%,#1675bd 75%);box-shadow:0 0 16px #56b6ff}75%{transform:translate3d(15px,80px,-8px);background:radial-gradient(circle at 30% 25%,#fff,#8bdbff 22%,#1675bd 75%);box-shadow:0 0 16px #56b6ff}100%{transform:translate3d(-145px,-7px,38px);background:radial-gradient(circle at 30% 25%,#fff,#ffb8a3 22%,#d63e51 75%);box-shadow:0 0 16px #ff6275}}
    .gas-message{min-height:56px;color:#c4d9e4;font-size:17px;padding:10px 0}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.controls .primary{background:#135b59;border-color:#63d9c1}.controls .primary:hover{background:#1b7068}
    .full-cycle{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:center;margin:25px 0}.cycle-node{text-align:center;background:#0d293c;border:1px solid #55778a;border-radius:18px;padding:16px 10px;min-height:92px;display:grid;align-content:center}.cycle-node strong{display:block}.cycle-node small{color:#b5cedb;margin-top:3px}.cycle-arrow{text-align:center;color:var(--gold);font-size:23px}.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.legend i{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px}.legend .blue-dot{background:var(--blue)}.legend .red-dot{background:var(--red)}
    .full-cycle{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr)}
    .quiz-wrap{max-width:980px;margin:0 auto}.quiz-progress{color:#a9c4d2;margin:0 0 10px}.quiz-question{font-size:clamp(24px,3.2vw,40px);line-height:1.2;margin:10px 0 24px}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px}.option{text-align:left;padding:18px 20px;font-size:clamp(17px,1.8vw,22px);line-height:1.35;min-height:78px}.option.selected{border:2px solid var(--gold);background:#25445a}.option.correct{background:#15644b;border-color:#70e4b5}.option.wrong{background:#733b48;border-color:#ff929a}.feedback{font-size:18px;line-height:1.45;min-height:55px;color:#a5f2dd;margin:16px 0 8px}.quiz-score{font-size:clamp(26px,4vw,48px);color:var(--gold);margin:18px 0}.review-list{padding-left:23px}.review-list li{font-size:17px;color:#dceaf2}.sources{margin-top:32px}.sources summary{color:#b9f3e5}.sources li{font-size:15px;margin:8px 0;color:#d8e6ed}.bottomline{height:4px;width:100%;background:linear-gradient(90deg,#ff6b78 0 50%,#56a9fa 50% 100%);margin:28px 0 0}
    @media(max-width:900px){header{align-items:flex-start}.layout,.heart-layout,.circuit-layout,.cover{grid-template-columns:1fr}.cover{min-height:auto}.cover-visual .art{min-height:280px}.heart-photo img{max-height:300px}.circuit-stage{min-height:350px}.full-cycle{grid-template-columns:1fr}.cycle-arrow{transform:rotate(90deg)}}
    @media(max-width:650px){header{padding:12px 14px}.brand{width:100%}header select{max-width:100%;width:100%}header nav{width:100%}header nav button{flex:1;padding:9px 8px}.utility{width:100%}.utility button{flex:1}.three-parts,.options{grid-template-columns:1fr}.part{min-height:0}.flow-rule{grid-template-columns:1fr;gap:6px}.flow-arrow{transform:rotate(90deg)}main{padding:22px 16px 40px}.art{min-height:230px;padding:12px}.circuit-stage{min-height:320px}.route-node{min-width:105px;padding:8px 7px;font-size:12px}.node-left{left:1%}.node-right{right:1%}.node-top{top:5%}.orbit-ring{width:72%;height:45%}.orbit-core{width:74px;height:74px}.blood-cell{width:14px;height:14px}.cover-copy h1{font-size:42px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
    body.reduced *,body.reduced *::before,body.reduced *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
    .circuit-stage.paused .blood-cell,.circuit-stage.paused .orbit-core{animation-play-state:paused!important}
  </style>
</head>
<body>
  <header>
    <div class="brand">CIÊNCIAS <span>• 8º ANO</span> · Luciano Costa</div>
    <label class="sr-only" for="menu">Escolher tela</label>
    <select id="menu" aria-label="Escolher tela"></select>
    <nav aria-label="Navegação da apresentação"><button id="prev" type="button" aria-label="Tela anterior">← Anterior</button><button id="next" type="button" aria-label="Próxima tela">Próxima →</button></nav>
    <div class="utility"><button id="full" type="button">Tela cheia</button><button id="motion" type="button" aria-pressed="false">Reduzir movimento</button></div>
  </header>
  <progress id="progress" value="1" max="11" aria-label="Progresso da apresentação"></progress>
  <main id="main" tabindex="-1" aria-live="polite" aria-atomic="true"></main>
  <div class="bottomline" aria-hidden="true"></div>
<script>
const slides=[
  {id:"abertura",title:"O caminho do sangue",summary:"Uma viagem pelo sistema circulatório"},
  {id:"rede",title:"Uma rede que trabalha sem parar",summary:"Coração + vasos + sangue"},
  {id:"coracao",title:"O coração: duas bombas em uma",summary:"Quatro câmaras, dois lados"},
  {id:"valvulas",title:"Válvulas: portas de mão única",summary:"O sangue segue em um só sentido"},
  {id:"vasos",title:"Artérias, capilares e veias",summary:"Três tipos, funções diferentes"},
  {id:"sangue",title:"O sangue leva e traz",summary:"Células e plasma em ação"},
  {id:"pulmonar",title:"Circuito pulmonar",summary:"Coração ↔ pulmões"},
  {id:"sistemica",title:"Circuito sistêmico",summary:"Coração ↔ corpo"},
  {id:"volta",title:"Uma volta completa",summary:"Do corpo aos pulmões e de volta"},
  {id:"excecao",title:"A exceção que evita a confusão",summary:"Artéria não quer dizer “sangue vermelho”"},
  {id:"quiz",title:"Quiz final",summary:"Vamos revisar a viagem do sangue"}
];
const A="assets/";
const quizData=[
  {q:"Qual câmara bombeia sangue para os pulmões?",o:["Átrio esquerdo","Ventrículo esquerdo","Átrio direito","Ventrículo direito"],a:3,r:"O ventrículo direito envia sangue para os pulmões pela artéria pulmonar."},
  {q:"Qual é a função principal das válvulas cardíacas?",o:["Produzir oxigênio","Evitar que o sangue volte","Filtrar resíduos do sangue","Fazer as trocas gasosas"],a:1,r:"As válvulas permitem a passagem e ajudam a impedir o refluxo."},
  {q:"Onde acontecem as trocas de oxigênio, nutrientes e resíduos com os tecidos?",o:["Na aorta","Nas veias cavas","Nos capilares","Nos átrios"],a:2,r:"Os capilares têm paredes muito finas e ficam junto às células."},
  {q:"Qual vaso leva sangue com pouco oxigênio do coração aos pulmões?",o:["Aorta","Veias pulmonares","Artérias pulmonares","Artéria renal"],a:2,r:"As artérias pulmonares são a exceção importante: saem do coração levando sangue com pouco oxigênio."},
  {q:"Qual sequência mostra corretamente os dois circuitos?",o:["Corpo → lado direito → pulmões → lado esquerdo → corpo","Corpo → lado esquerdo → pulmões → lado direito → corpo","Pulmões → lado direito → corpo → lado esquerdo → pulmões","Corpo → pulmões → corpo, sem passar pelo coração"],a:0,r:"O lado direito faz o circuito pulmonar; o lado esquerdo faz o sistêmico."}
];
const $=id=>document.getElementById(id);
let current=0,quizIndex=0,selected=null,quizScore=0,quizAnswered=false,quizComplete=false,quizSelections=[];
const reducedByOS=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reducedByOS)document.body.classList.add('reduced');
const img=(file,alt,caption,source)=>`<figure><img class="photo" src="${A+file}" alt="${alt}" loading="lazy"><figcaption class="caption">${caption} <a href="${source}" target="_blank" rel="noopener">Fonte</a></figcaption></figure>`;
const panel=(content)=>`<div class="art">${content}</div>`;
const cycleStage=(kind)=>{
  const isPulmonary=kind==='pulmonar';
  const systemClass=isPulmonary?'':' systemic';
  const leftLabel=isPulmonary?'Ventrículo direito':'Ventrículo esquerdo';
  const topLabel=isPulmonary?'Pulmões':'Tecidos do corpo';
  const rightLabel=isPulmonary?'Átrio esquerdo':'Átrio direito';
  const note=isPulmonary?'O sangue chega com pouco O₂. Nos pulmões, libera CO₂ e recebe O₂.':'O sangue entrega O₂ aos tecidos e recolhe parte do CO₂.';
  return `<div class="circuit-stage${systemClass}" id="circuitStage" role="img" aria-label="Animação em perspectiva 3D do circuito ${isPulmonary?'pulmonar: ventrículo direito, pulmões e átrio esquerdo':'sistêmico: ventrículo esquerdo, tecidos e átrio direito'}"><div class="orbit-ring" aria-hidden="true"></div><span class="blood-cell" aria-hidden="true"></span><span class="blood-cell" aria-hidden="true"></span><span class="blood-cell" aria-hidden="true"></span><div class="orbit-core" aria-hidden="true">♥</div><div class="route-node node-top">${topLabel}<small>${isPulmonary?'troca de gases':'troca com células'}</small></div><div class="route-node node-left">${leftLabel}<small>${isPulmonary?'sangue com pouco O₂':'sangue com muito O₂'}</small></div><div class="route-node node-right">${rightLabel}<small>${isPulmonary?'sangue com muito O₂':'sangue com pouco O₂'}</small></div></div><div class="legend"><span><i class="blue-dot"></i>Pouco O₂</span><span><i class="red-dot"></i>Muito O₂</span><span class="note">Cores didáticas: o sangue não é azul.</span></div><p class="gas-message" id="gasMessage">${note}</p><div class="controls"><button class="primary" id="gasButton" type="button">${isPulmonary?'Ver troca gasosa':'Ver troca nos tecidos'}</button><button id="pauseFlow" type="button" aria-pressed="false">Pausar animação</button></div>`;
};
function shell(slide,body){return `<section class="slide" data-slide="${slide.id}"><div class="eyebrow">${slide.summary}</div><h1>${slide.title}</h1>${body}</section>`;}
function render(){
  const slide=slides[current];
  $('menu').value=String(current);$('progress').value=current+1;$('progress').max=slides.length;
  $('prev').disabled=current===0;$('next').disabled=current===slides.length-1;
  document.title=`${slide.title} — Sistema circulatório | Ciências, 8º ano`;
  if(slide.id==='abertura'){
    $('main').innerHTML=`<section class="slide cover"><div class="cover-copy"><div class="eyebrow">CIÊNCIAS · 8º ANO</div><h1>O sistema <span class="accent">circulatório</span></h1><p>Uma viagem em 3D para descobrir como o sangue percorre o coração, os pulmões e o corpo inteiro.</p><span class="cover-stamp">11 telas · animações · quiz final</span><p class="note">Pergunta-guia: por onde o sangue passa para voltar ao ponto de partida?</p></div><div class="cover-visual">${panel(img('coracao-3d.gif','Animação tridimensional em corte de um coração humano batendo','Modelo 3D animado do coração.','https://commons.wikimedia.org/wiki/File:CG_Heart.gif'))}</div></section>`;
  }else if(slide.id==='rede'){
    $('main').innerHTML=shell(slide,`<p class="lead">O sistema circulatório é uma rede fechada: o sangue circula pelos vasos e passa pelo coração em um trajeto contínuo.</p><div class="layout"><div class="three-parts" style="grid-template-columns:1fr"><article class="part"><div class="symbol" aria-hidden="true">♥</div><h3>Coração</h3><p>Uma bomba muscular que impulsiona o sangue.</p></article><article class="part"><div class="symbol" aria-hidden="true">↝</div><h3>Vasos sanguíneos</h3><p>Os caminhos por onde o sangue segue.</p></article><article class="part"><div class="symbol" aria-hidden="true">●</div><h3>Sangue</h3><p>Transporta gases, nutrientes e outras substâncias.</p></article></div><div>${panel('<div class="chamber-graphic"><h3>Um circuito fechado</h3><p class="note">Coração → vasos → tecidos → vasos → coração</p><div class="flow-rule" style="grid-template-columns:1fr"><div class="flow-step">Coração · bomba</div><div class="flow-arrow">↓</div><div class="flow-step">Vasos · caminhos</div><div class="flow-arrow">↓</div><div class="flow-step">Sangue · transporte</div></div></div>')}</div></div><p class="note">O sistema é “fechado” porque, normalmente, o sangue permanece dentro do coração e dos vasos.</p>`);
  }else if(slide.id==='coracao'){
    const graphic=`<div class="chamber-graphic" role="img" aria-label="Esquema: o lado direito do coração aparece à esquerda do desenho, em azul; o lado esquerdo aparece à direita, em vermelho."><div class="side-labels"><div class="side-label">Lado direito · pouco O₂</div><div class="side-label">Lado esquerdo · muito O₂</div></div><div class="side-labels"><div class="side"><div class="chamber blue">Átrio direito<small>recebe do corpo</small></div><div class="chamber-arrow">↓</div><div class="chamber blue">Ventrículo direito<small>bombeia aos pulmões</small></div></div><div class="side"><div class="chamber red">Átrio esquerdo<small>recebe dos pulmões</small></div><div class="chamber-arrow">↓</div><div class="chamber red">Ventrículo esquerdo<small>bombeia ao corpo</small></div></div></div><p class="note">Os lados são separados por uma parede chamada septo.</p></div>`;
    $('main').innerHTML=shell(slide,`<div class="heart-layout"><div>${panel(img('coracao-real-openstax.jpg','Fotografia de um coração humano real, vista externa','Coração humano real; foto de anatomia.','https://commons.wikimedia.org/wiki/File:2000_Human_Heart_Photo.jpg'))}<p class="note">Átrios recebem; ventrículos bombeiam.</p></div>${panel(graphic)}</div>`);
  }else if(slide.id==='valvulas'){
    $('main').innerHTML=shell(slide,`<div class="layout"><div><p class="lead">Entre um átrio e um ventrículo há uma válvula. Ela abre para o sangue avançar e fecha para reduzir o refluxo.</p><div class="flow-rule"><div class="flow-step">Átrio</div><div class="flow-arrow">→</div><div class="flow-step gold">Válvula</div><div class="flow-arrow">→</div><div class="flow-step">Ventrículo</div></div><p class="note">Também há válvulas nas saídas dos ventrículos. O septo separa os lados do coração; não é uma válvula.</p></div><div>${panel(`<div class="valve-demo" aria-label="Demonstração estática do fluxo através de uma válvula"><div class="chamber blue">Átrio</div><div class="chamber-arrow">↓</div><div class="chamber gold" style="color:#162b37;background:#ffcf70">Válvula abre</div><div class="chamber-arrow">↓</div><div class="chamber blue">Ventrículo</div></div>`)}<p class="caption">As válvulas funcionam como portas de sentido único.</p></div></div>`);
  }else if(slide.id==='vasos'){
    $('main').innerHTML=shell(slide,`<div class="layout"><div><p class="lead">O nome do vaso depende da direção do sangue em relação ao coração.</p><ul class="note"><li><strong class="red-text">Artérias:</strong> levam sangue para longe do coração; suas paredes são geralmente mais espessas e elásticas.</li><li><strong class="gold">Capilares:</strong> vasos microscópicos onde ocorrem trocas com os tecidos.</li><li><strong class="blue-text">Veias:</strong> conduzem o sangue de volta ao coração; muitas, especialmente nos membros, têm válvulas.</li></ul><div class="flow-rule"><div class="flow-step">Artéria</div><div class="flow-arrow">→</div><div class="flow-step gold">Capilares</div><div class="flow-arrow">→</div><div class="flow-step">Veia</div></div></div><div>${panel(img('hemacia-capilar-micrografia.jpg','Micrografia eletrônica de uma hemácia em um capilar','Hemácia dentro de um capilar; micrografia eletrônica.','https://commons.wikimedia.org/wiki/File:A_red_blood_cell_in_a_capillary,_pancreatic_tissue_-_TEM.jpg'))}</div></div>`);
  }else if(slide.id==='sangue'){
    $('main').innerHTML=shell(slide,`<p class="lead">O sangue é formado por uma parte líquida e por células e fragmentos celulares com funções diferentes.</p><div class="three-parts"><article class="part"><div class="symbol" aria-hidden="true">◉</div><h3>Plasma</h3><p>Parte líquida que transporta nutrientes, hormônios e resíduos.</p></article><article class="part"><div class="symbol red-text" aria-hidden="true">●</div><h3>Hemácias</h3><p>Transportam a maior parte do oxigênio com ajuda da hemoglobina.</p></article><article class="part"><div class="symbol" aria-hidden="true">✚</div><h3>Leucócitos e plaquetas</h3><p>Leucócitos atuam na defesa; plaquetas ajudam na coagulação.</p></article></div><p class="note">O sangue também leva gás carbônico e ajuda a distribuir calor pelo corpo.</p>`);
  }else if(slide.id==='pulmonar'){
    $('main').innerHTML=shell(slide,`<div class="circuit-layout"><div>${cycleStage('pulmonar')}</div><div><p class="lead">Na circulação pulmonar, o sangue sai do lado direito do coração, vai aos pulmões e retorna ao lado esquerdo.</p><div class="flow-rule"><div class="flow-step">Ventrículo direito</div><div class="flow-arrow">→</div><div class="flow-step">Artérias pulmonares</div><div class="flow-arrow">→</div><div class="flow-step">Pulmões</div></div><p class="note">Nos capilares pulmonares, o sangue libera dióxido de carbono (CO₂) e recebe oxigênio (O₂). Depois retorna pelas veias pulmonares ao átrio esquerdo.</p>${panel(img('alveolos-pulmonares.jpg','Imagem microscópica de alvéolos pulmonares normais','Alvéolos pulmonares vistos ao microscópio.','https://commons.wikimedia.org/wiki/File:Normal_lung_Alveoli_(3678762542).jpg'))}</div></div>`);
    wireCircuit();
  }else if(slide.id==='sistemica'){
    $('main').innerHTML=shell(slide,`<div class="circuit-layout"><div>${cycleStage('sistemica')}</div><div><p class="lead">Na circulação sistêmica, o sangue sai do lado esquerdo do coração, percorre o corpo e retorna ao lado direito.</p><div class="flow-rule"><div class="flow-step">Ventrículo esquerdo</div><div class="flow-arrow">→</div><div class="flow-step">Aorta e artérias</div><div class="flow-arrow">→</div><div class="flow-step">Tecidos</div></div><p class="note">Nos capilares dos tecidos, o sangue entrega oxigênio e nutrientes e recolhe parte do CO₂. As veias cavas o conduzem de volta ao átrio direito.</p>${panel(img('coracao-aorta-pulmonar.jpg','Coração real com a aorta e a artéria pulmonar','Coração e grandes vasos em uma dissecção anatômica.','https://commons.wikimedia.org/wiki/File:Heart,_aorta_and_pulmonary_artery.jpg'))}</div></div>`);
    wireCircuit();
  }else if(slide.id==='volta'){
    $('main').innerHTML=shell(slide,`<p class="lead">A circulação humana é dupla: em cada volta completa, o sangue passa duas vezes pelo coração — uma vez entre coração e pulmões, outra entre coração e corpo.</p><div class="full-cycle" role="img" aria-label="Corpo → lado direito do coração → pulmões → lado esquerdo do coração → corpo"><div class="cycle-node"><strong>Corpo</strong><small>veias cavas → átrio direito</small></div><div class="cycle-arrow">→</div><div class="cycle-node"><strong class="blue-text">Lado direito</strong><small>ventrículo bombeia aos pulmões</small></div><div class="cycle-arrow">→</div><div class="cycle-node"><strong>Pulmões</strong><small>libera CO₂, recebe O₂</small></div><div class="cycle-arrow">→</div><div class="cycle-node"><strong class="red-text">Lado esquerdo</strong><small>ventrículo bombeia pela aorta</small></div><div class="cycle-arrow">→</div><div class="cycle-node"><strong>Corpo</strong><small>capilares fazem trocas</small></div></div><p class="note">Vermelho e azul são convenções para muito e pouco oxigênio — não representam a cor literal do sangue nem a cor de todos os vasos.</p>`);
  }else if(slide.id==='excecao'){
    $('main').innerHTML=shell(slide,`<div class="layout"><div><p class="lead">Atenção: “artéria” não quer dizer necessariamente sangue rico em oxigênio, e “veia” não quer dizer necessariamente pouco oxigênio.</p><div class="part"><h3 class="gold">A regra correta é a direção:</h3><p><strong>Artéria</strong> sai do coração. <strong>Veia</strong> chega ao coração.</p></div><p class="note"><span class="blue-text">Artérias pulmonares</span> levam sangue com pouco O₂ aos pulmões; <span class="red-text">veias pulmonares</span> trazem sangue com muito O₂ ao coração.</p></div><div>${panel(`<div class="chamber-graphic"><div class="three-parts" style="grid-template-columns:1fr 1fr;margin:0"><div class="part"><div class="eyebrow blue-text">SAI do coração</div><h3>Artéria pulmonar</h3><p>Sangue com pouco O₂ → pulmões</p></div><div class="part"><div class="eyebrow red-text">CHEGA ao coração</div><h3>Veia pulmonar</h3><p>Sangue com muito O₂ → coração</p></div></div></div>`)}<p class="caption">As trocas nos pulmões explicam a exceção.</p></div></div>`);
  }else if(slide.id==='quiz'){
    renderQuiz();return;
  }
  $('main').focus({preventScroll:true});
}
function wireCircuit(){
  const stage=$('circuitStage');
  $('pauseFlow').addEventListener('click',e=>{const paused=stage.classList.toggle('paused');document.body.classList.toggle('flow-paused',paused);e.currentTarget.textContent=paused?'Retomar animação':'Pausar animação';e.currentTarget.setAttribute('aria-pressed',String(paused));});
  $('gasButton').addEventListener('click',e=>{const after=stage.classList.toggle('gas-changed');$('gasMessage').textContent=stage.classList.contains('systemic')?(after?'Nos tecidos, o sangue entrega oxigênio às células e recebe parte do CO₂.':'O sangue chega com muito O₂. Nos tecidos, entrega O₂ e recolhe parte do CO₂.'):(after?'Nos pulmões, o sangue libera CO₂ e recebe O₂; depois volta ao coração com mais oxigênio.':'O sangue chega com pouco O₂. Nos pulmões, libera CO₂ e recebe O₂.');e.currentTarget.textContent=after?'Rever a troca':'Ver troca nos gases';});
}
function resetQuiz(){quizIndex=0;selected=null;quizScore=0;quizAnswered=false;quizComplete=false;quizSelections=[];}
function renderQuiz(){
  if(quizComplete){
    const feedback=quizData.map((q,i)=>`<li><strong>${quizSelections[i]===q.a?'Acertou':'Revise'}:</strong> ${q.r}</li>`).join('');
    $('main').innerHTML=`<section class="slide quiz-wrap"><div class="eyebrow">Quiz concluído · 5 questões</div><h1>Mandou bem!</h1><div class="quiz-score">Você acertou ${quizScore} de 5</div><p class="lead">A circulação funciona como um circuito contínuo: coração → pulmões → coração → corpo → coração.</p><h2>Revisão rápida</h2><ol class="review-list">${feedback}</ol><div class="controls"><button class="primary" type="button" onclick="resetQuiz();renderQuiz()">Refazer o quiz</button><button type="button" onclick="goTo(0)">Rever a apresentação</button></div>${sourceDetails()}</section>`;
    $('prev').disabled=false;$('next').disabled=true;return;
  }
  const q=quizData[quizIndex];
  const options=q.o.map((text,i)=>`<button class="option${selected===i?' selected':''}${quizAnswered&&i===q.a?' correct':''}${quizAnswered&&selected===i&&i!==q.a?' wrong':''}" type="button" aria-pressed="${selected===i}" ${quizAnswered?'disabled':''} onclick="selectAnswer(${i})"><span class="gold">${String.fromCharCode(65+i)}.</span> ${text}</button>`).join('');
  const feedback=quizAnswered?`<div class="feedback" role="status">${selected===q.a?'Correto! ':'Quase! '}${q.r}</div>`:`<div class="feedback" aria-live="polite"></div>`;
  $('main').innerHTML=`<section class="slide quiz-wrap"><div class="eyebrow">Quiz final · questão ${quizIndex+1} de ${quizData.length}</div><p class="quiz-progress">Escolha uma alternativa e confira sua resposta.</p><h2 class="quiz-question">${q.q}</h2><div class="options">${options}</div>${feedback}<div class="controls"><button class="primary" id="checkAnswer" type="button" ${selected===null||quizAnswered?'disabled':''} onclick="checkAnswer()">Conferir resposta</button>${quizAnswered?`<button type="button" onclick="nextQuestion()">${quizIndex<quizData.length-1?'Próxima questão':'Ver resultado'}</button>`:''}</div>${quizIndex===quizData.length-1?sourceDetails():''}</section>`;
}
function sourceDetails(){return `<details class="sources"><summary>Fontes científicas e créditos das imagens</summary><ul><li>Conteúdo científico: <a href="https://openstax.org/books/concepts-biology/pages/16-3-circulatory-and-respiratory-systems" target="_blank" rel="noopener">OpenStax, Concepts of Biology, seção 16.3</a>.</li><li>Animação 3D do coração: DrJanaOfficial, via <a href="https://commons.wikimedia.org/wiki/File:CG_Heart.gif" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 4.0.</li><li>Fotografia do coração: OpenStax Anatomy &amp; Physiology, <a href="https://commons.wikimedia.org/wiki/File:2000_Human_Heart_Photo.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY 4.0.</li><li>Coração, aorta e artéria pulmonar: Anatomist90, <a href="https://commons.wikimedia.org/wiki/File:Heart,_aorta_and_pulmonary_artery.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 3.0.</li><li>Hemácia em capilar: Louisa Howard, <a href="https://commons.wikimedia.org/wiki/File:A_red_blood_cell_in_a_capillary,_pancreatic_tissue_-_TEM.jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, domínio público.</li><li>Alvéolos pulmonares: Yale Rosen, <a href="https://commons.wikimedia.org/wiki/File:Normal_lung_Alveoli_(3678762542).jpg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 2.0.</li><li>Diagramas de circulação em CSS: elaborados para esta apresentação; vermelho e azul indicam, de forma didática, muito e pouco oxigênio.</li></ul></details>`;}
function selectAnswer(i){if(quizAnswered)return;selected=i;renderQuiz();}
function checkAnswer(){if(selected===null)return;quizAnswered=true;quizSelections[quizIndex]=selected;if(selected===quizData[quizIndex].a)quizScore++;renderQuiz();}
function nextQuestion(){if(quizIndex<quizData.length-1){quizIndex++;selected=null;quizAnswered=false;renderQuiz();}else{quizComplete=true;renderQuiz();}}
function goTo(index){const from=current;current=Math.max(0,Math.min(slides.length-1,index));if(current===slides.length-1&&from!==current)resetQuiz();render();}
$('menu').innerHTML=slides.map((s,i)=>`<option value="${i}">${i+1}. ${s.title}</option>`).join('');
$('menu').addEventListener('change',e=>goTo(Number(e.target.value)));
$('next').addEventListener('click',()=>goTo(current+1));$('prev').addEventListener('click',()=>goTo(current-1));
$('full').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch{}});
$('motion').addEventListener('click',e=>{const on=document.body.classList.toggle('reduced');e.currentTarget.textContent=on?'Ativar movimento':'Reduzir movimento';e.currentTarget.setAttribute('aria-pressed',String(on));});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,button,[contenteditable="true"]'))return;if(e.key==='ArrowRight')goTo(current+1);if(e.key==='ArrowLeft')goTo(current-1);});
render();
</script>
</body>
</html>
